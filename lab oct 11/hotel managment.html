<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <h1>Bhromon Shathi</h1>
      <h2>Register for Hotel Management</h2>

    <form action="#" method="post">

        <label for="hotel_name">Hotel Name:</label>
        <input type="text" id="hotel_name" name="hotel_name" placeholder="Enter hotel name" required>
        <br><br>

        <label for="hotel_address">Address:</label>
        <input type="text" id="hotel_address" name="hotel_address" placeholder="Enter hotel address" required>
        <br><br>

        <label for="hotel_contact">Contact Number:</label>
        <input type="tel" id="hotel_contact" name="hotel_contact" placeholder="01XXXXXXXXX" required>
        <br><br>

        <label for="hotel_email">Email:</label>
        <input type="email" id="hotel_email" name="hotel_email" placeholder="hotel@email.com" required>
        <br><br>

        <label for="hotel_website">Webpage Link:</label>
        <input type="url" id="hotel_website" name="hotel_website" placeholder="https://www.example.com">
        <br><br>

        <label for="hotel_licence">Licence Number:</label>
        <input type="text" id="hotel_licence" name="hotel_licence" placeholder="Enter licence number" required>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
    </body>
    </center>
</body>
</html>
