<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>
<center>
    <h1>Bhromon Shathi</h1>
<h2>Register for Traveller</h2>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="nid">NID:</label>
        <input type="text" id="nid" name="nid" placeholder="Enter your NID number" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" required>
        <br><br>

        <label for="passport">Passport Number:</label>
        <input type="text" id="passport" name="passport" placeholder="Enter your passport number">
        <br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your address">
        <br><br>

        <label for="nationality">Nationality:</label>
        <input type="text" id="nationality" name="nationality" placeholder="e.g. Bangladeshi">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        Gender:
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="Dhaka">Dhaka</option>
            <option value="Khulna">Khulna</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Sylhet">Sylhet</option>
             <option value="chittogong">Chittagong</option>
              <option value="Barisal">Barisal</option>
        </select>
        <br><br>


        <label for="about">About Yourself:</label>
        <br>
        <textarea id="about" name="about" rows="4" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

    <br>
    <hr>

    <h2>Register for Hotel Management</h2>

    <form action="#" method="post">

        <label for="hotel_name">Hotel Name:</label>
        <input type="text" id="hotel_name" name="hotel_name" placeholder="Enter hotel name" required>
        <br><br>

        <label for="hotel_address">Address:</label>
        <input type="text" id="hotel_address" name="hotel_address" placeholder="Enter hotel address" required>
        <br><br>

        <label for="hotel_contact">Contact Number:</label>
        <input type="tel" id="hotel_contact" name="hotel_contact" placeholder="01XXXXXXXXX" required>
        <br><br>

        <label for="hotel_email">Email:</label>
        <input type="email" id="hotel_email" name="hotel_email" placeholder="hotel@email.com" required>
        <br><br>

        <label for="hotel_website">Webpage Link:</label>
        <input type="url" id="hotel_website" name="hotel_website" placeholder="https://www.example.com">
        <br><br>

        <label for="hotel_licence">Licence Number:</label>
        <input type="text" id="hotel_licence" name="hotel_licence" placeholder="Enter licence number" required>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</center>
</body>
</html>
